name: CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm run check

  test:
    name: Test (NestJS ${{ matrix.nest }}, Terminus ${{ matrix.terminus }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - nest: '12'
            terminus: '12'
          - nest: '11'
            terminus: '12'
          - nest: '11'
            terminus: '11'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install NestJS ${{ matrix.nest }} and Terminus ${{ matrix.terminus }}
        if: matrix.nest != '12' || matrix.terminus != '12'
        run: >-
          pnpm --filter @nestjs-modules/ioredis add -D
          @nestjs/common@^${{ matrix.nest }}
          @nestjs/core@^${{ matrix.nest }}
          @nestjs/platform-express@^${{ matrix.nest }}
          @nestjs/testing@^${{ matrix.nest }}
          @nestjs/terminus@^${{ matrix.terminus }}

      - name: Build
        run: pnpm run build --filter=@nestjs-modules/ioredis

      - name: Test
        run: pnpm run test --filter=@nestjs-modules/ioredis

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: cd packages/ioredis && npx tsc --noEmit
